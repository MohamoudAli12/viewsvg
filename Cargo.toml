[package]
name = "svg_viewer"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"

[[bin]]
name = "viewsvg"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4.6", features = ["derive"] }
csscolorparser = "0.8"
eframe = "0.36"
egui = "0.36"
notify = "8"
resvg = "0.48"

[profile.release]
lto = true
codegen-units = 1
strip = true
